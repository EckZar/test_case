name: POM Relief V4 Validation
on:
  push:
    branches: [shipmodule-pom-reference-lab]
    paths:
      - '.github/workflows/pom-relief-v4-check.yml'
      - 'shipmodule-pom-lab/PomDecalMaterial.js'
      - 'shipmodule-pom-lab/PomReliefProfile.js'
      - 'shipmodule-pom-lab/lab-512.js'
      - 'shipmodule-pom-lab/hatch512.html'
      - 'shipmodule-pom-lab/tests/relief-v4*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  math-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: |
          mkdir -p /tmp/pom-v4
          npm install --prefix /tmp/pom-v4 --no-save --ignore-scripts three@0.180.0 playwright@1.55.0
          ln -s /tmp/pom-v4/node_modules node_modules
          /tmp/pom-v4/node_modules/.bin/playwright install --with-deps chromium
      - name: Relief math and shader assembly regression tests
        run: |
          mkdir -p pom-v4-evidence
          node --test shipmodule-pom-lab/tests/relief-v4.test.mjs | tee pom-v4-evidence/unit-tests.txt
      - name: Render real POM and test controls and hosted URL
        env:
          POM_PLAYWRIGHT_PATH: /tmp/pom-v4/node_modules/playwright/index.mjs
        run: node shipmodule-pom-lab/tests/relief-v4-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pom-relief-v4-evidence
          path: pom-v4-evidence/
          retention-days: 14
