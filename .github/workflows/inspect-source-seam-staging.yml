name: Inspect Source Seam Staging
on:
  push:
    branches: [shipmodule-pom-reference-lab]
    paths: ['.github/workflows/inspect-source-seam-staging.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Inspect staged Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/inspect.mjs <<'NODE'
          import fs from 'node:fs/promises';
          import crypto from 'node:crypto';
          const target = '6b1f071dd7f09dd448009c6af4dfbd84cc37b2d678b39e0fc793b304da2e76bf';
          const items = JSON.parse(await fs.readFile('shipmodule-pom-lab/tests/staged-parts.json','utf8'));
          const data = new Map();
          for (const item of items) {
            const response = await fetch(`https://api.github.com/repos/EckZar/test_case/git/blobs/${item.sha}`, {headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GH_TOKEN}`}});
            if (!response.ok) throw new Error(`${item.name}: HTTP ${response.status}`);
            const result = await response.json();
            const bytes = Buffer.from(result.content,'base64');
            data.set(item.name, bytes);
            const text = bytes.subarray(0,80).toString('utf8').replace(/[^\x20-\x7e]/g,'.');
            console.log(JSON.stringify({name:item.name,len:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),hex:bytes.subarray(0,24).toString('hex'),text}));
          }
          const sha = b => crypto.createHash('sha256').update(b).digest('hex');
          const tryCandidate = (name,b) => console.log('CANDIDATE',name,b.length,sha(b),sha(b)===target?'MATCH':'');
          const select = prefix => items.filter(x=>x.name.startsWith(prefix)).sort((a,b)=>a.name.localeCompare(b.name)).map(x=>data.get(x.name));
          for (const prefix of ['base-','plain-','xor-']) {
            const parts=select(prefix); if(!parts.length) continue;
            const joined=Buffer.concat(parts); tryCandidate(prefix+'raw',joined);
            const text=joined.toString('utf8').replace(/\s+/g,'');
            if (/^[A-Za-z0-9+/=]+$/.test(text)) {
              try { tryCandidate(prefix+'base64',Buffer.from(text,'base64')); } catch {}
            }
          }
          const blob74 = await fetch('https://api.github.com/repos/EckZar/test_case/git/blobs/74a9ec496e3883cb589631c2a7a3caab7aeb456f',{headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GH_TOKEN}`}}).then(r=>r.json());
          const b74=Buffer.from(blob74.content,'base64');
          tryCandidate('blob74-raw',b74);
          const t74=b74.toString('utf8').replace(/\s+/g,'');
          if(/^[A-Za-z0-9+/=]+$/.test(t74)) tryCandidate('blob74-base64',Buffer.from(t74,'base64'));
          NODE
          node /tmp/inspect.mjs
