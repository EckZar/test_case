name: Publish Exact Source Seam Stand
on:
  push:
    branches: [shipmodule-pom-reference-lab]
    paths: ['.github/workflows/source-seam-staged-export.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shipmodule-pom-reference-lab
          fetch-depth: 0
      - name: Restore exact-source POM stand from staged archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_BLOB: b51a96454b32abec1856867d29b2b445b0dea56d
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request
          req = urllib.request.Request(
              f"https://api.github.com/repos/EckZar/test_case/git/blobs/{os.environ['ARCHIVE_BLOB']}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)
          data = base64.b64decode(payload["content"])
          open('/tmp/source-seams-exact.zip', 'wb').write(data)
          print(f"downloaded {len(data)} bytes")
          PY
          file /tmp/source-seams-exact.zip
          unzip -t /tmp/source-seams-exact.zip
          rm -rf /tmp/source-seams-exact
          mkdir -p /tmp/source-seams-exact
          unzip -q /tmp/source-seams-exact.zip -d /tmp/source-seams-exact
          PAGE=$(find /tmp/source-seams-exact -path '*/shipmodule-pom-lab/seams.html' -print -quit)
          test -n "$PAGE"
          PATCH_ROOT=$(dirname "$(dirname "$PAGE")")
          test -f "$PATCH_ROOT/shipmodule-pom-lab/seam-pack-fixture.js"
          test -d "$PATCH_ROOT/shipmodule-pom-lab/seam-source-data"
          rm -rf shipmodule-pom-lab/seam-source-data
          cp -a "$PATCH_ROOT/shipmodule-pom-lab/." shipmodule-pom-lab/
          if [ -d "$PATCH_ROOT/.github" ]; then cp -a "$PATCH_ROOT/.github/." .github/; fi
          rm -rf shipmodule-pom-lab/source-seams tmp
          test "$(find shipmodule-pom-lab/seam-source-data -type f -name '*.js' | wc -l)" -eq 29
          node --check shipmodule-pom-lab/seams.js
          node --check shipmodule-pom-lab/seam-pack-codec.js
          node --check shipmodule-pom-lab/seam-pack-fixture.js
          grep -q 'shipmodule-source-seam-pom-pack-v2' shipmodule-pom-lab/seam-pack-fixture.js
          grep -q '9 ORIGINAL ASSETS' shipmodule-pom-lab/seams.html
      - name: Commit exact-source stand
        run: |
          set -euo pipefail
          git config user.name 'EckZar'
          git config user.email '32589564+EckZar@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to publish'
            exit 0
          fi
          git commit -m 'feat(pom-lab): publish exact-source seam POM test stand'
          git push origin HEAD:shipmodule-pom-reference-lab
