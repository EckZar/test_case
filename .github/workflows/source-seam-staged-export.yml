name: Source Seam Staged Export
on:
  push:
    branches: [shipmodule-pom-reference-lab]
    paths: ['.github/workflows/source-seam-staged-export.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Export every available staged Git blob
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import crypto from 'node:crypto';
          const manifest=JSON.parse(await fs.readFile('shipmodule-pom-lab/tests/staged-parts.json','utf8'));
          await fs.mkdir('pom-validation/staged-parts',{recursive:true});
          const report=[];
          for(const item of manifest){
            const response=await fetch(`https://api.github.com/repos/EckZar/test_case/git/blobs/${item.sha}`,{headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GITHUB_TOKEN}`}});
            if(!response.ok){report.push({...item,status:response.status});continue;}
            const result=await response.json();
            const bytes=Buffer.from(result.content,'base64');
            const actual=crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            if(actual!==item.sha) throw new Error(`SHA mismatch ${item.name}`);
            await fs.writeFile(`pom-validation/staged-parts/${item.name}`,bytes);
            report.push({...item,status:200,size:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex')});
          }
          await fs.writeFile('pom-validation/staged-parts/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          NODE
          find pom-validation/staged-parts -type f -printf '%f %s bytes\n' | sort
          file pom-validation/staged-parts/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-seam-staged-parts
          path: pom-validation/staged-parts/
          retention-days: 3
