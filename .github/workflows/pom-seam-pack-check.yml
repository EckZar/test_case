name: POM Seam Pack Validation
on:
  push:
    branches: [shipmodule-pom-reference-lab]
    paths:
      - '.github/workflows/pom-seam-pack-check.yml'
      - 'shipmodule-pom-lab/seams.html'
      - 'shipmodule-pom-lab/seams.js'
      - 'shipmodule-pom-lab/seam-pack-codec.js'
      - 'shipmodule-pom-lab/seam-pack-v1.json'
      - 'shipmodule-pom-lab/tests/seam-pack-browser.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install pinned browser dependency
        run: |
          mkdir -p /tmp/seam-pack
          npm install --prefix /tmp/seam-pack --no-save --ignore-scripts playwright@1.55.0
          /tmp/seam-pack/node_modules/.bin/playwright install --with-deps chromium
      - name: Syntax check
        run: |
          node --check shipmodule-pom-lab/seams.js
          node --check shipmodule-pom-lab/seam-pack-codec.js
      - name: Render local and immutable hosted site
        env:
          POM_PLAYWRIGHT_PATH: /tmp/seam-pack/node_modules/playwright/index.mjs
        run: node shipmodule-pom-lab/tests/seam-pack-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pom-seam-pack-evidence
          path: seam-pack-evidence/
          retention-days: 14
